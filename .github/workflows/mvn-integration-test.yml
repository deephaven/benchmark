# Build, run unit tests, and run integration tests against Deephaven in Docker on the Github runner
# (mvn verify)

name: Integration Test (Runner)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Docker Pull Deephaven and Redpanda
      run: |
        cp .github/resources/integration-docker-compose.yml docker-compose.yml
        docker compose pull

    - name: Docker Up Deephaven and Redpanda
      run: docker compose up -d

    - name: Build with Maven
      run: mvn -B verify --file pom.xml 
      
    - name: Docker Down Deephaven and Redpanda
      run: docker compose down

    - name: Archive Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Integration Benchmarks and Logs
        path: |
          results/**/*
