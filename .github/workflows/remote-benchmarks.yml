# Run benchmarks on a remote server for the calling workflows
# - This workflow is reusable with run_type set to nightly, release, compare, or adhoc
# - Scripts ending in "-local" run on the github runner
# - Scripts ending in "-remote" run are executed on the remote test server through ssh
# - test_device_addr selects both the server (<default>|<matrix>|ip) and the concurrency group
# - Clearing runs here, not in callers, so it cannot wipe a run holding the concurrency group

name: Remote Benchmarks (Reusable)

on:
  workflow_call:
    inputs:
      run_type:
        required: true
        type: string
      docker_image:
       required: true
       type: string
      run_label:
        required: true
        type: string
      test_package:
        required: true
        type: string
      test_class_list:
        required: true
        type: string
      test_iterations:
        required: true
        type: string
      scale_row_count:
        required: true
        type: string
      distribution:
        required: true
        type: string
      test_device_addr:
        description: 'Server ip, or <default> for the nightly host, or <matrix> for the matrix host'
        required: true
        type: string
      clear_server:
        description: 'Wipe artifacts, containers, images, and data before setup'
        required: true
        type: boolean
      config_options:
        required: true
        type: string
        
env:
  HOST: >-
    ${{ inputs.test_device_addr == '<default>' && secrets.BENCHMARK_HOST_NIGHT
    || inputs.test_device_addr == '<matrix>' && secrets.BENCHMARK_HOST_MATRIX
    || inputs.test_device_addr }}

concurrency:
  group: ${{ inputs.test_device_addr }}
  cancel-in-progress: ${{ inputs.run_type == 'nightly' }}

jobs:
  setup-benchmarks:
    runs-on: ubuntu-24.04
    outputs:
      matrix-iterations: ${{ steps.matrix-iterations.outputs.matrix-iterations }}
    env:
      SD: .github/scripts
      USER: ${{secrets.BENCHMARK_USER}}
      REPO: ${{github.repository}}
      BRANCH: ${{github.ref_name}}
      RUN_TYPE: ${{inputs.run_type}}
      DOCKER_IMG: ${{inputs.docker_image}}
      TEST_ITERS: ${{inputs.test_iterations}}
      CONFIG_OPTS: "${{inputs.config_options}}"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Local Scripts
      run: |
        sudo chmod +x ${SD}/*
        ${SD}/setup-ssh-local.sh ${HOST} "${{secrets.BENCHMARK_KEY}}"

    - name: Clear Remote Test Server
      if: ${{ inputs.clear_server }}
      run: |
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} clear-test-server-remote

    - name: Run Remote Test Server Setup
      run: |
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} setup-test-server-remote ${REPO} ${BRANCH} ${RUN_TYPE} "${DOCKER_IMG}"

    - name: Run Remote Server Distribution Build
      if: ${{ !startsWith(env.DOCKER_IMG, 'ghcr.io/') && contains(env.DOCKER_IMG, ':') }}
      run: |
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} build-server-distribution-remote "${DOCKER_IMG}"
        
    - name: Run Remote Docker Image Build
      if: ${{ !startsWith(env.DOCKER_IMG, 'ghcr.io/') && contains(env.DOCKER_IMG, ':') }}
      run: |
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} build-docker-image-remote

    - name: Start Remote Deephaven Server
      run: | 
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} manage-deephaven-remote start "${DOCKER_IMG}" "${CONFIG_OPTS}"

    - name: Run Remote Benchmark Artifact Build
      run: |
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} build-benchmark-artifact-remote
        
    - name: Set Iteration Matrix Output Variable
      id: matrix-iterations
      run: | 
        ${SD}/matrix_array.sh matrix-iterations ${RUN_TYPE} ${TEST_ITERS} >> "$GITHUB_OUTPUT"

  run-benchmarks:
    needs: setup-benchmarks
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJson(needs.setup-benchmarks.outputs.matrix-iterations) }}
    env: 
      SD: .github/scripts
      USER: ${{secrets.BENCHMARK_USER}}
      RUN_TYPE: ${{inputs.run_type}}
      TEST_PKG: ${{inputs.test_package}}
      TEST_CLS: "${{inputs.test_class_list}}"
      ROW_CNT: ${{inputs.scale_row_count}}
      DISTRIB: ${{inputs.distribution}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup Local Scripts
      run: |
        sudo chmod +x ${SD}/*
        ${SD}/setup-ssh-local.sh ${HOST} "${{secrets.BENCHMARK_KEY}}"
    
    - name: Run Remote Benchmarks
      run: |
        set -f
        TEST_CLS=$(echo "${TEST_CLS}" | tr -d '[:space:]')
        ${SD}/run-ssh-local.sh ${HOST} ${USER} ${SD} run-benchmarks-remote ${RUN_TYPE} "${TEST_PKG}" "${TEST_CLS}" ${ROW_CNT} ${DISTRIB} ${{ matrix.tag }}

  report-benchmarks:
    needs: run-benchmarks
    runs-on: ubuntu-24.04

    # The NFS sync below is shared by both hosts, so it needs its own lock: two runs mirroring the
    # whole bucket at once can delete each other's files. Adhoc never syncs, so it opts out.
    concurrency:
      group: ${{ inputs.run_type == 'adhoc' && format('nfs-publish-adhoc-{0}', github.run_id) || 'nfs-publish' }}
      cancel-in-progress: false

    env:
      SD: .github/scripts
      USER: ${{secrets.BENCHMARK_USER}}
      RUN_TYPE: ${{inputs.run_type}}
      DOCKER_IMG: ${{inputs.docker_image}}
      RUN_LABEL: ${{inputs.run_label}}
      ACTOR: "${{ inputs.run_type == 'adhoc' && github.actor || github.repository_owner }}"
      METAL_API_KEY: ${{ secrets.BENCHMARK_METAL_AUTH_TOKEN }}
      METAL_PROJECT_ID: ${{ secrets.BENCHMARK_METAL_PROJECT_ID }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Local Scripts
      run: |
        sudo chmod +x ${SD}/*
        ${SD}/setup-ssh-local.sh ${HOST} "${{secrets.BENCHMARK_KEY}}"
    
    - name: Fetch Benchmark Results and Prepare for Upload
      id: fetch-results
      run: |
        ${SD}/fetch-results-local.sh ${HOST} ${USER} ${SD} ${RUN_TYPE} "${ACTOR}" "${RUN_LABEL}"
        cat fetch-results-local.out >> "$GITHUB_OUTPUT"

    - name: Authorize GCloud Credentials
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        credentials_json: ${{secrets.BENCHMARK_GCLOUD}}
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Upload Benchmark Results to GCloud
      uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
      with:
        path: ${{env.RUN_TYPE}}
        destination: deephaven-benchmark
        process_gcloudignore: false
        gzip: false

    - name: Publish Slack Notification Tables
      if: ${{ env.RUN_TYPE != 'adhoc' }}
      run: |
        ${SD}/run-publish-local.sh ${RUN_TYPE} "${{secrets.BENCHMARK_SLACK_CHANNEL}}" "${{secrets.BENCHMARK_SLACK_TOKEN}}" 

    - name: Sync GCloud with Demo NFS
      if: ${{ env.RUN_TYPE != 'adhoc' }}
      run: |
        ACCESS_TOKEN=$(gcloud auth print-access-token)
        gcloud compute ssh --quiet --zone "us-central1-a" --project "deephaven-oss" dhc-demo-nfs-client \
          --command="sudo env CLOUDSDK_AUTH_ACCESS_TOKEN=${ACCESS_TOKEN} gcloud storage rsync --delete-unmatched-destination-objects --recursive gs://deephaven-benchmark /nfs/deephaven-benchmark"
        gcloud compute ssh --quiet --zone "us-central1-a" --project "deephaven-oss" dhc-demo-nfs-client \
          --command="sudo find /nfs/deephaven-benchmark -mindepth 1 -type d -empty -delete"

  purge-expired-benchmark-systems:
    if: always()
    needs: [run-benchmarks, report-benchmarks]
    runs-on: ubuntu-24.04
    env:
      SD: .github/scripts
      METAL_API_KEY: ${{ secrets.BENCHMARK_METAL_AUTH_TOKEN }}
      METAL_PROJECT_ID: ${{ secrets.BENCHMARK_METAL_PROJECT_ID }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Purge Expired Bare Metal
      id: purge-metal
      run: |
        ${SD}/adhoc.sh purge-metal ${METAL_API_KEY} ${METAL_PROJECT_ID}
        cat adhoc-purge-metal.out >> "$GITHUB_OUTPUT"
