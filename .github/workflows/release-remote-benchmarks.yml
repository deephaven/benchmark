# Run benchmarks on a remote system according to the release defined 
# in resources/release-benchmark-docker-compose.yml
# - Runs the rows in matrix/release.sh, passing the requested image in as IMG
# - Each row is a full pass that publishes before the next starts, so a failed row costs one pass

name: Release Benchmark Test on Docker Deephaven

on:
  workflow_dispatch:
    inputs:
     docker_image:
       description: 'Docker Image (release version or "edge" for pre-release)'
       required: true
       default: '42.0'
       type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate Docker Image Version
      env:
        IMG: ${{ inputs.docker_image }}
      run: |
        if [[ "${IMG}" == "edge" ]]; then
          echo "Pre-release run. The set label comes from the version the engine reports"
        elif ! [[ "${IMG}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
          echo "::error::docker_image '${IMG}' is not a release version (expected numeric format like 42.4 or 42.4.1) or 'edge'"
          exit 1
        fi

    - name: Build Matrix Combinations
      id: build-matrix
      env:
        IMG: ${{ inputs.docker_image }}
      run: |
        .github/scripts/build-matrix.sh ".github/matrix/release.sh"

  run-benchmarks:
    needs: generate-matrix
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/remote-benchmarks.yml
    with:
      run_type: ${{ matrix.run_type }}
      docker_image: ${{ matrix.docker_image }}
      run_label: ${{ matrix.run_label }}
      test_package: ${{ matrix.test_package }}
      test_class_list: ${{ matrix.test_class_list }}
      test_iterations: ${{ matrix.test_iterations }}
      scale_row_count: ${{ matrix.scale_row_count }}
      distribution: ${{ matrix.distribution }}
      test_device_addr: "<matrix>"
      clear_server: ${{ strategy.job-index == 0 }}
      config_options: ${{ matrix.config_options }}
    secrets: inherit
