# Run comparison (competitive) benchmarks on a remote system, measuring Deephaven against DuckDB,
# Flink, Pandas, and PyArrow, which the tests run as python inside the Deephaven container
# - Calls the reusable workflow remote-benchmarks.yml

name: Compare Benchmark Test on Docker Deephaven

on:
  workflow_dispatch:
    inputs:
     docker_image:
       description: 'Docker Image (release version or "edge" for pre-release)'
       required: true
       default: '42.0'
       type: string

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
    - name: Validate Docker Image Version
      env:
        IMG: ${{ inputs.docker_image }}
      run: |
        if [[ "${IMG}" == "edge" ]]; then
          echo "Pre-release run. The set label comes from the version the engine reports"
        elif ! [[ "${IMG}" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
          echo "::error::docker_image '${IMG}' is not a release version (expected numeric format like 42.4 or 42.4.1) or 'edge'"
          exit 1
        fi

  process-compare-benchmarks:
    needs: validate-inputs
    uses: ./.github/workflows/remote-benchmarks.yml
    with:
      run_type: compare
      docker_image: ${{ inputs.docker_image }}
      run_label: "<version>"
      test_package: "io.deephaven.benchmark.tests.compare"
      test_class_list: "*"
      test_iterations: 5
      scale_row_count: 70000000
      distribution: random
      test_device_addr: "<matrix>"
      clear_server: true
      config_options: "<default>"
    secrets: inherit
