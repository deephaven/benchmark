# Run benchmarks on the always-on nightly server (<default>) for the nightly (edge) build
# - Calls the reusable workflow remote-benchmarks.yml

name: Nightly Benchmarks (Nightly Server)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  process-nightly-benchmarks:
    if: ${{github.repository_owner == 'deephaven'}}
    uses: ./.github/workflows/remote-benchmarks.yml
    with:
      run_type: nightly
      docker_image: edge
      run_label: "<date>"
      test_package: "io.deephaven.benchmark.tests.standard"
      test_class_list: "*"
      test_iterations: 5
      scale_row_count: 10000000
      distribution: random
      test_device_addr: "<default>"
      clear_server: true
      config_options: "<default>"
    secrets: inherit
