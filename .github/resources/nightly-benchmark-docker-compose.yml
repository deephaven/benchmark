services:
  deephaven:
    image: ghcr.io/deephaven/server:edge
    security_opt:
      - apparmor:unconfined
    ports:
      - "${DEEPHAVEN_PORT:-10000}:10000"
    volumes:
      - ./data:/data
      - ./minio:/minio
    environment:
      - "START_OPTS=-Xmx24g -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler"

  redpanda:
    security_opt:
    - apparmor:unconfined
    command:
    - redpanda
    - start
    - --smp 2
    - --reserve-memory 0M
    - --memory=1G
    - --overprovisioned
    - --node-id 0
    - --check=false
    - --kafka-addr
    - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
    - --advertise-kafka-addr
    - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    - --pandaproxy-addr 0.0.0.0:8082
    - --advertise-pandaproxy-addr redpanda:8082
    image: redpandadata/redpanda:v25.2.14@sha256:b53a3a981be7536c2b5240efa13d7284e760ed01911627f3533e628117e427e2
    ports:
    - 8081:8081
    - 8082:8082
    - 9092:9092
    - 29092:29092
    
  minio-server:
    security_opt:
    - apparmor:unconfined
    image: ghcr.io/deephaven/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    command: server /minio --console-address ":9001"
    hostname: minio
    environment:
      MINIO_DOMAIN: minio
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    networks:
      default:
        aliases:
          - data.minio
    expose:
    - "9000"
    - "9001"
    ports:
    - 9000:9000
    - 9001:9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - ./minio:/minio

  minio-bucket:
    security_opt:
    - apparmor:unconfined
    image: ghcr.io/deephaven/mc:RELEASE.2025-08-13T08-35-41Z@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    depends_on:
      - minio-server
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set endpoint http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb endpoint/data;
      /usr/bin/mc anonymous set public endpoint/data;
      exit 0;
      "
